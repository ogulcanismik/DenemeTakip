name: deneme_takip
description: YKS, LGS ve KPSS denemelerini çevrimdışı takip eden uygulama.
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  fl_chart: ^1.2.0
  google_fonts: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app_icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#2F333C"
  adaptive_icon_foreground: assets/branding/app_icon.png
  web:
    generate: true
    image_path: assets/branding/app_icon.png
    background_color: "#2F333C"
    theme_color: "#2F333C"

flutter_native_splash:
  color: "#2F333C"
  image: assets/branding/app_icon.png
  android: true
  ios: false
  web: true
  android_12:
    color: "#2F333C"
    image: assets/branding/app_icon.png
